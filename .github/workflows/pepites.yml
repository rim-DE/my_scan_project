# Met à jour data/pepites.csv depuis Keepa le 1er et le 15 du mois, en 3 passages de 4 000 livres au plus
# (voir scripts/pepites.ts),
# ou à la demande : onglet Actions > « Pépites Keepa » > Run workflow.
name: Pépites Keepa

on:
  schedule:
    - cron: "15 1,7,13 1,15 * *"
  workflow_dispatch:
    inputs:
      max:
        description: "Nombre maximum de livres (vide = tous)"
        required: false

permissions:
  contents: write

concurrency:
  group: pepites
  cancel-in-progress: false

jobs:
  pepites:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Chargement Keepa
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
        run: npm run pepites -- ${{ inputs.max && format('--max {0}', inputs.max) || '' }}
      - name: Enregistrement du fichier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pepites.csv data/pepites-ecartes.csv
          git diff --cached --quiet && exit 0
          git commit -m "Pépites Keepa : mise à jour du $(date +%F)"
          git pull --rebase origin ${{ github.ref_name }}
          git push
